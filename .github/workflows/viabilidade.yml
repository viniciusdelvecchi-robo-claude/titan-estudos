name: viabilidade

# F2-10: relatório de viabilidade (V3 a 2%; 29 mundos nulos condicionados + 29 com momento Sharpe 1).
# Um mundo por tarefa (58 ao todo). Lê medidas/f2_10_risco_aberto.json (falha fechado se faltar).
# O agregado é feito fora daqui, com --agregar sobre os artefatos.
# Entradas do disparo só entram por variável de ambiente e são validadas; nunca interpoladas no shell (T12).

on:
  workflow_dispatch:
    inputs:
      somente:
        description: "opcional: lista de tarefas separadas por vírgula (vazio = todas)"
        default: ""

permissions:
  contents: read

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      tarefas: ${{ steps.p.outputs.tarefas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # série 3.12; a versão exata sai em cada resultado (plataforma)
      - run: pip install -r requirements.txt
      - id: p
        env:
          ENT_SOMENTE: ${{ inputs.somente }}
        run: |
          total=$(python ferramentas/viabilidade_f210.py --listar)
          python - "$total" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, re, sys
          total = int(sys.argv[1])
          so = os.environ["ENT_SOMENTE"].strip()
          if not re.fullmatch(r"[\d,\s]*", so):
              raise SystemExit("entrada invalida")
          ts = sorted({int(x) for x in so.split(",") if x.strip()}) if so else list(range(total))
          ts = [t for t in ts if 0 <= t < total][:256]
          print("tarefas=" + json.dumps(ts))
          EOF

  mundo:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tarefa: ${{ fromJSON(needs.plano.outputs.tarefas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: rodar um mundo
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          TAREFA: ${{ matrix.tarefa }}
        run: |
          [[ "$TAREFA" =~ ^[0-9]+$ ]] || { echo "entrada invalida"; exit 1; }
          python ferramentas/viabilidade_f210.py --tarefa "$TAREFA" --proc-interno 4 "viab_$TAREFA.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f2_10-viab-tarefa-${{ matrix.tarefa }}
          path: viab_${{ matrix.tarefa }}.jsonl
          if-no-files-found: ignore
          retention-days: 30
